<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Revisa los datos · HiveOn</title>
    <link rel="icon" type="image/webp" th:href="@{/img/hiveon-simbolo.webp}">
    <link rel="stylesheet" th:href="@{/css/hiveon.css}">
    <link rel="stylesheet" th:href="@{/css/interior.css}">
</head>
<body class="aplicacion" th:with="modulo=''">
    <header th:replace="~{fragmentos :: barra}"></header>
    <div th:replace="~{fragmentos :: contexto}"></div>
    <main id="contenido-app" tabindex="-1" class="area area-formulario vista-operacion-invalida">
        <h1>Revisa los datos</h1>
        <p class="aviso aviso-error" role="alert" th:text="${mensaje}"></p>
        <div class="acciones-modulo">
            <a class="boton" th:href="@{${regreso}}" th:text="${etiquetaRegreso ?: 'Volver a la gestión'}">Volver</a>
        </div>
    </main>
</body>
</html>
