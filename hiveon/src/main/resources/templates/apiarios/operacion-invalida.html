<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Revisa los datos · HiveOn</title>
    <link rel="stylesheet" th:href="@{/css/hiveon.css}">
</head>
<body>
    <header th:replace="~{fragmentos :: barra}"></header>
    <main class="area area-formulario">
        <h1>Revisa los datos</h1>
        <p class="aviso aviso-error" role="alert" th:text="${mensaje}"></p>
        <div class="acciones-modulo">
            <a class="boton" th:href="@{${regreso}}">Volver a la gestión</a>
        </div>
    </main>
</body>
</html>
