<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${apiario.nombre} · HiveOn|">Apiario · HiveOn</title>
    <link rel="icon" type="image/webp" th:href="@{/img/hiveon-simbolo.webp}">
    <link rel="stylesheet" th:href="@{/css/hiveon.css}">
    <link rel="stylesheet" th:href="@{/css/interior.css}">
</head>
<body class="aplicacion" th:with="modulo='apiarios'">
    <header th:replace="~{fragmentos :: barra}"></header>
    <div th:replace="~{fragmentos :: contexto}"></div>
    <main id="contenido-app" tabindex="-1" class="area area-formulario vista-detalle">
        <a class="volver" th:href="@{/apiarios}">Volver a Mis apiarios</a>
        <h1 th:text="${apiario.nombre}">Apiario</h1>
        <img class="foto-detalle" src="/img/apiario-hiveon.webp" width="1440" height="1080" alt="Paisaje ilustrativo de un apiario, generado con IA">
        <dl class="tarjeta datos-apiario">
            <dt>Departamento</dt>
            <dd th:text="${apiario.departamento}">Departamento</dd>
            <dt>Municipio</dt>
            <dd th:text="${apiario.municipio}">Municipio</dd>
            <dt>Vereda</dt>
            <dd th:text="${apiario.vereda != null ? apiario.vereda : 'Sin indicar'}">Vereda</dd>
            <dt>Estado</dt>
            <dd th:text="${apiario.archivado ? 'Archivado' : 'Activo'}">Activo</dd>
        </dl>
        <nav class="acciones-modulo" aria-label="Opciones del apiario">
            <a class="boton" th:href="@{/apiarios/{id}/gestion(id=${apiario.id})}">Colmenas y seguimiento</a>
            <a class="boton boton-secundario" th:href="@{/apiarios/{id}/clima(id=${apiario.id})}">Consultar clima</a>
        </nav>
    </main>
</body>
</html>
