<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auditoría · HiveOn</title>
    <link rel="icon" type="image/webp" th:href="@{/img/hiveon-simbolo.webp}">
    <link rel="stylesheet" th:href="@{/css/hiveon.css}">
    <link rel="stylesheet" th:href="@{/css/interior.css}">
</head>
<body class="aplicacion" th:with="modulo='auditoria'">
    <header th:replace="~{fragmentos :: barra}"></header>
    <div th:replace="~{fragmentos :: contexto}"></div>
    <main id="contenido-app" tabindex="-1" class="area vista-auditoria">
        <a class="volver" th:href="@{/administracion}">Volver a Administración</a>
        <h1>Auditoría</h1>
        <p class="estado-vacio" th:if="${eventos.isEmpty()}">No hay eventos en esta página.</p>
        <ul class="registros">
            <li class="tarjeta" th:each="e : ${eventos}">
                <strong th:text="${#strings.replace(e.accion, '_', ' ')}"></strong>
                <div th:text="|${e.actor} · ${e.fecha} · ${e.resultado}|"></div>
                <div th:if="${e.recurso != null}" th:text="|${e.recurso} ${e.recurso_id ?: ''}|"></div>
            </li>
        </ul>
        <nav class="acciones-modulo" aria-label="Páginas de auditoría">
            <a class="boton boton-secundario" th:if="${pagina > 1}" th:href="@{/administracion/auditoria(pagina=${pagina - 1})}">Anterior</a>
            <a class="boton boton-secundario" th:if="${haySiguiente}" th:href="@{/administracion/auditoria(pagina=${pagina + 1})}">Siguiente</a>
        </nav>
    </main>
</body>
</html>
